<script>
'use strict';
    // ───── 01 チャットから取り込む ─────

    // 貼り付けられた文章から、JSONのデータ部分だけを取り出す
    function extractJson(text) {
      const blocks = [...text.matchAll(/```(?:json)?\s*([\s\S]*?)```/gi)].map((m) => m[1]);
      const candidates = blocks.length ? blocks : [text];
      for (const c of candidates) {
        const start = c.search(/[\[{]/);
        if (start < 0) continue;
        const open = c[start];
        const end = c.lastIndexOf(open === '[' ? ']' : '}');
        if (end <= start) continue;
        try {
          const v = JSON.parse(c.slice(start, end + 1));
          return Array.isArray(v) ? v : (Array.isArray(v.entries) ? v.entries : [v]);
        } catch (e) { /* 次の候補へ */ }
      }
      return null;
    }

    // 表記ゆれを整える（「1,200円」→1200、「10/3」→今年の10月3日 など）
    function normalizeAmount(v) {
      if (typeof v === 'number') return v;
      const s = String(v == null ? '' : v).replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[,，¥￥円\s]/g, '');
      return s === '' ? NaN : Number(s);
    }
    function normalizeDate(v) {
      const s = String(v == null ? '' : v).trim().replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
      const base = new Date();
      const shift = { '今日': 0, '本日': 0, '昨日': -1, '一昨日': -2, 'おととい': -2 }[s];
      if (shift !== undefined || s === '') {
        base.setDate(base.getDate() + (shift || 0));
        return base.getFullYear() + '-' + pad(base.getMonth() + 1) + '-' + pad(base.getDate());
      }
      let m = /^(\d{4})[-\/年.](\d{1,2})[-\/月.](\d{1,2})日?$/.exec(s);
      if (m) return m[1] + '-' + pad(m[2]) + '-' + pad(m[3]);
      m = /^(\d{1,2})[\/月](\d{1,2})日?$/.exec(s);
      if (m) return base.getFullYear() + '-' + pad(m[1]) + '-' + pad(m[2]);
      return s;
    }
    function normalizeType(v) {
      const s = String(v || '').trim().toLowerCase();
      if (['収入', 'income', 'in'].includes(s)) return '収入';
      return '支出';
    }
    const METHOD_ALIASES = { 'カード': 'クレジット', 'クレカ': 'クレジット', 'クレジットカード': 'クレジット', 'paypay': '電子マネー',
      'suica': '電子マネー', 'pasmo': '電子マネー', 'icoca': '電子マネー', 'qr決済': '電子マネー', '引き落とし': '口座振替', '振替': '口座振替' };
    function normalizeMethod(v) {
      const s = String(v || '').trim();
      if (state.config.methods.includes(s)) return s;
      return METHOD_ALIASES[s.toLowerCase()] || 'その他';
    }

    function toPreviewRow(raw) {
      const flags = [];
      const type = normalizeType(raw.type);
      let category = String(raw.category || '').trim();
      if (!state.config.categories[type].includes(category)) {
        if (category) flags.push('カテゴリ「' + category + '」は一覧にないため「その他」にしました');
        category = 'その他';
      }
      return {
        date: normalizeDate(raw.date),
        type: type,
        amount: normalizeAmount(raw.amount),
        category: category,
        method: normalizeMethod(raw.method),
        memo: String(raw.memo == null ? '' : raw.memo),
        business_ratio: raw.business_ratio == null || raw.business_ratio === '' ? 0 : Number(raw.business_ratio),
        flags: flags,
        error: '',
      };
    }

</script>
