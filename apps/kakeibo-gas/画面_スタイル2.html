<style>

    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 18px; }
    .btn { background: var(--ink); color: var(--paper); border: 1px solid var(--ink); padding: 10px 20px; cursor: pointer; }
    .btn.ghost { background: transparent; color: var(--ink); }
    .btn:disabled { opacity: 0.4; cursor: default; }

    .msg { margin-top: 14px; padding: 10px 12px; border-left: 3px solid var(--ink); background: var(--white); font-size: 13px; white-space: pre-line; }
    .msg.err { border-left-color: var(--ink); border-left-style: double; border-left-width: 6px; }
    .msg[hidden] { display: none; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { font-family: var(--mo); font-size: 10px; letter-spacing: 0.14em; color: var(--ink-3); font-weight: 400; text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--ink); }
    td { padding: 6px 4px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
    td.num, th.num { text-align: right; font-family: var(--mo); letter-spacing: 0.02em; white-space: nowrap; }
    .scroll { overflow-x: auto; margin-top: 16px; border-top: 1px solid var(--rule); }
    .swipe { display: none; font-size: 11px; color: var(--ink-3); margin-top: 12px; }
    @media (max-width: 760px) { .swipe { display: block; } }
    #preview { min-width: 720px; }
    #preview input, #preview select { padding: 5px 6px; font-size: 13px; }
    #preview select { padding-right: 24px; background-position: calc(100% - 13px) 50%, calc(100% - 8px) 50%; }
    #preview .w-date { width: 132px; }
    #preview .w-type { width: 66px; }
    #preview .w-amt { width: 78px; text-align: right; }
    #preview .w-sel { width: 104px; }
    #preview .w-memo { min-width: 90px; }
    #preview .w-ratio { width: 52px; }
    #preview tr.bad td { background: var(--paper-2); }
    .flag { display: block; font-size: 11px; color: var(--ink-2); margin-top: 2px; }
    .x { background: none; border: 1px solid var(--rule-2); width: 28px; height: 28px; cursor: pointer; color: var(--ink-2); }

    .month { display: flex; align-items: center; justify-content: space-between; }
    .month strong { font-family: var(--mo); font-size: 20px; letter-spacing: 0.08em; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--ink); border-bottom: 1px solid var(--rule-2); margin-top: 14px; }
    .stats div { padding: 12px 10px; border-right: 1px solid var(--rule); }
    .stats div:last-child { border-right: 0; }
    .stats b { display: block; font-family: var(--mo); font-size: 18px; letter-spacing: 0.02em; font-weight: 600; }
    .stats small { display: block; font-size: 11px; color: var(--ink-2); font-family: var(--mo); letter-spacing: 0.02em; }
    .stats.two { grid-template-columns: 1fr 1fr; margin-top: 0; border-top: 0; }
    .bars { margin-top: 20px; }
    .bars h3 { font-family: var(--mo); font-size: 11px; letter-spacing: 0.16em; color: var(--ink-3); font-weight: 400; margin: 14px 0 4px; border-bottom: 1px solid var(--rule); }
    .bars h3:first-child { margin-top: 0; }
    .bars h3 span { float: right; letter-spacing: 0.02em; color: var(--ink-2); }
    tfoot td { font-weight: 700; border-bottom: 0; border-top: 1px solid var(--ink); }
    h2.sp { margin-top: 32px; }
    .bar { display: grid; grid-template-columns: 6.5em 1fr 9em; gap: 10px; align-items: center; font-size: 13px; padding: 4px 0; }
    .bar i { display: block; height: 10px; background: var(--ink); }
    .bar .track { background: var(--paper-2); }
    .bar .num { white-space: nowrap; }
    .sub { font-size: 12px; color: var(--ink-2); margin-top: 12px; }
    .empty { color: var(--ink-3); font-size: 13px; padding: 18px 0; }

    /* ダッシュボード */
    .hero { border-top: 1px solid var(--ink); border-bottom: 1px solid var(--rule); margin-top: 14px; padding: 14px 10px 12px; }
    .hero b { display: block; font-family: var(--mo); font-size: 34px; font-weight: 600; letter-spacing: 0.01em; line-height: 1.3; }
    .hero small { font-family: var(--mo); font-size: 12px; color: var(--ink-2); letter-spacing: 0.02em; }
    .dh { font-family: var(--mo); font-size: 11px; letter-spacing: 0.16em; color: var(--ink-3); font-weight: 400; margin: 28px 0 10px; }
    .band { display: flex; gap: 2px; height: 28px; }
    .band > * { flex: 1 1 0; min-width: 3px; }
    .band .none { background: var(--paper-2); color: var(--ink-3); font-size: 12px; padding: 4px 10px; }
    .band--labels { height: auto; margin-top: 4px; font-family: var(--mo); font-size: 11px; color: var(--ink-2); letter-spacing: 0.02em; }
    .band--labels span { overflow: hidden; white-space: nowrap; }
    /* 4分類の塗り分け。色は使わず、濃淡と斜線（製図のハッチング）で見分ける */
    .sw.t1 { background: var(--ink); }
    .sw.t2 { background: var(--ink-2); }
    .sw.t3 { background: var(--ink-3); }
    .sw.t4 { background: repeating-linear-gradient(45deg, var(--ink-2) 0 1.5px, transparent 1.5px 5px); box-shadow: inset 0 0 0 1px var(--ink-2); }
    .tiers { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--rule-2); margin-top: 16px; }
    .tier { padding: 12px 10px; border-bottom: 1px solid var(--rule); }
    .tier:nth-child(odd) { border-right: 1px solid var(--rule); }
    .tier__h { font-size: 12px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
    .tier__h i { width: 12px; height: 12px; flex: none; }
    .tier b { display: block; font-family: var(--mo); font-size: 20px; font-weight: 600; letter-spacing: 0.02em; }
    .tier small { display: block; font-family: var(--mo); font-size: 11px; color: var(--ink-2); letter-spacing: 0.02em; }

    @media (max-width: 520px) {
      .grid { grid-template-columns: 1fr; }
      nav button { font-size: 11px; padding: 10px 3px; letter-spacing: 0; }
      .stats b { font-size: 15px; }
      .bar { grid-template-columns: 4.5em 1fr 8em; gap: 8px; }
      .hero b { font-size: 28px; }
      .tier b { font-size: 17px; }
    }
</style>
