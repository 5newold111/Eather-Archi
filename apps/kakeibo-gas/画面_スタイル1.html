<style>
    :root {
      --paper:   #ededea;
      --paper-2: #e5e5e1;
      --white:   #f6f6f3;
      --ink:     #16171a;
      --ink-2:   #54565a;
      --ink-3:   #8a8b8d;
      --rule:    #d0d0ca;
      --rule-2:  #bcbcb6;
      --ja: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
      --mo: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--ja);
      font-size: 15px;
      line-height: 1.7;
      letter-spacing: 0.02em;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
    :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

    .wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 64px; }
    .mo { font-family: var(--mo); letter-spacing: 0.12em; }
    .label { font-family: var(--mo); font-size: 11px; letter-spacing: 0.16em; color: var(--ink-3); text-transform: uppercase; }

    header { display: flex; align-items: baseline; justify-content: space-between; border-bottom: 2px solid var(--ink); padding-bottom: 10px; }
    header h1 { font-size: 20px; font-weight: 700; }
    header h1 .label { margin-right: 10px; }

    nav { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--rule-2); }
    nav button {
      background: none; border: 0; border-right: 1px solid var(--rule); padding: 12px 6px; cursor: pointer;
      text-align: left; color: var(--ink-2); font-size: 14px;
    }
    nav button:last-child { border-right: 0; }
    nav button .label { display: block; }
    nav button[aria-selected="true"] { color: var(--ink); font-weight: 700; box-shadow: inset 0 -3px 0 var(--ink); }

    section { padding-top: 24px; }
    section[hidden] { display: none; }
    h2 { font-size: 16px; margin-bottom: 4px; }
    .note { color: var(--ink-2); font-size: 13px; margin-bottom: 16px; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
    .grid .full { grid-column: 1 / -1; }
    label.f { display: block; }
    label.f > span { display: block; font-size: 12px; color: var(--ink-2); margin-bottom: 4px; }
    input, select, textarea {
      width: 100%; background: var(--white); border: 1px solid var(--rule-2); padding: 9px 10px; border-radius: 0;
      -webkit-appearance: none; appearance: none;
    }
    select { background-image: linear-gradient(45deg, transparent 50%, var(--ink-2) 50%), linear-gradient(135deg, var(--ink-2) 50%, transparent 50%);
      background-position: calc(100% - 15px) 50%, calc(100% - 10px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 28px; }
    textarea { min-height: 160px; font-family: var(--mo); font-size: 12px; letter-spacing: 0; line-height: 1.6; }
    .seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--rule-2); }
    .seg button { background: var(--white); border: 0; padding: 9px; cursor: pointer; color: var(--ink-2); }
    .seg button + button { border-left: 1px solid var(--rule-2); }
    .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
</style>
