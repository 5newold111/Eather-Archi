<script>
'use strict';
    function renderMonth(data) {
      const s = data.summary, p = data.prevSummary;
      $('sIncome').textContent = yen(s.income);
      $('sExpense').textContent = yen(s.expense);
      $('sBalance').textContent = (s.balance < 0 ? '−' : '') + yen(Math.abs(s.balance));
      $('sIncomePrev').textContent = diffText(s.income, p.income);
      $('sExpensePrev').textContent = diffText(s.expense, p.expense);
      $('sBalancePrev').textContent = diffText(s.balance, p.balance);
      $('sFixed').textContent = yen(s.fixed);
      $('sVariable').textContent = yen(s.variable);
      $('sFixedPrev').textContent = diffText(s.fixed, p.fixed);
      $('sVariablePrev').textContent = diffText(s.variable, p.variable);
      $('sBusiness').textContent = s.business ? '事業按分の合計（経費に回せる見込み額）: ' + yen(s.business) : '';

      // カテゴリ別の横棒を「固定費」「変動費」に分けて並べる（棒の長さは全体の最大値を基準にそろえる）
      const cats = Object.entries(s.byCategory).sort((a, b) => b[1] - a[1]);
      const max = cats.length ? cats[0][1] : 0;
      const bar = ([name, v]) => {
        const fill = el('i');
        fill.style.width = Math.max(2, Math.round(v / max * 100)) + '%';
        return el('div', { className: 'bar' }, [
          el('span', { textContent: name }),
          el('div', { className: 'track' }, [fill]),
          el('span', { className: 'num mo', textContent: yen(v) }),
        ]);
      };
      const group = (title, total, list) => list.length
        ? [el('h3', {}, [title, el('span', { textContent: yen(total) })])].concat(list.map(bar)) : [];
      $('bars').replaceChildren(...(cats.length
        ? group('固定費', s.fixed, cats.filter(([n]) => isFixed(n))).concat(group('変動費', s.variable, cats.filter(([n]) => !isFixed(n))))
        : [el('p', { className: 'empty', textContent: 'この月の記録はまだありません。' })]));

      $('list').tBodies[0].replaceChildren(...data.entries.map((e) => {
        const del = el('button', { className: 'x', textContent: '×', title: '削除' });
        del.setAttribute('aria-label', e.date + ' ' + e.category + ' ' + yen(e.amount) + ' を削除');
        del.addEventListener('click', () => removeEntry(e));
        const amount = (e.type === '収入' ? '+' : '') + yen(e.amount);
        return el('tr', {}, [
          el('td', { className: 'num', textContent: e.date.slice(5).replace('-', '/') }),
          el('td', { textContent: e.category }),
          el('td', { textContent: e.memo }),
          el('td', { className: 'num', textContent: amount }),
          el('td', {}, [del]),
        ]);
      }));
    }

    async function removeEntry(e) {
      if (!confirm(e.date + '　' + e.category + '　' + yen(e.amount) + '\nこの記録を削除しますか？')) return;
      try {
        await call('deleteEntry', e.id);
        loadMonth();
      } catch (err) {
        show('monthMsg', '削除に失敗しました: ' + (err && err.message || err), true);
      }
    }

    $('prevMonth').addEventListener('click', () => { state.month = shiftMonth(state.month, -1); loadMonth(); });
    $('nextMonth').addEventListener('click', () => { state.month = shiftMonth(state.month, 1); loadMonth(); });

</script>
