    <!-- 04 固定費 -->
    <section id="tab-fixed" role="tabpanel" hidden>
      <h2>毎月の固定費</h2>
      <p class="note">家賃・保険・通信費など、毎月決まって出ていくものを登録しておくと、ボタン一つでその月の家計簿にまとめて記録できます。同じ月に二重には登録されません。</p>
      <div class="scroll">
        <table id="fixedList">
          <thead><tr><th>引落日</th><th>名前</th><th>カテゴリ</th><th>支払方法</th><th class="num">金額</th><th></th></tr></thead>
          <tbody></tbody>
          <tfoot><tr><td colspan="4">毎月の合計</td><td class="num" id="fixedTotal">¥0</td><td></td></tr></tfoot>
        </table>
      </div>
      <div class="month" style="margin-top:24px">
        <button class="btn ghost" id="fixedPrev" aria-label="前の月">←</button>
        <strong id="fixedMonthLabel"></strong>
        <button class="btn ghost" id="fixedNext" aria-label="次の月">→</button>
      </div>
      <div class="row"><button class="btn" id="registerFixed">この月の固定費を登録</button></div>
      <div class="msg" id="fixedMsg" hidden></div>

      <h2 class="sp">固定費を追加</h2>
      <form id="fixedForm" class="grid" autocomplete="off">
        <label class="f full"><span>名前</span><input type="text" id="xName" maxlength="50" placeholder="家賃"></label>
        <label class="f"><span>金額（円）</span><input type="text" id="xAmount" inputmode="numeric" placeholder="85000"></label>
        <label class="f"><span>引落日（毎月）</span><input type="number" id="xDay" min="1" max="31" step="1" value="27"></label>
        <label class="f"><span>カテゴリ</span><select id="xCategory"></select></label>
        <label class="f"><span>支払方法</span><select id="xMethod"></select></label>
      </form>
      <div class="row"><button class="btn ghost" id="addFixed">リストに追加</button></div>
    </section>
