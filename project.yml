# XcodeGen の設定ファイル。
# Mac で `xcodegen generate` を実行すると Unikoro.xcodeproj が生成されます。
# .xcodeproj は生成物なので Git には入れません（.gitignore 参照）。
name: Unikoro
options:
  bundleIdPrefix: com.gonation
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"      # ストアに出るバージョン
    CURRENT_PROJECT_VERSION: "1"    # ビルド番号（同じバージョン内の通し番号）
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  Unikoro:
    type: application
    platform: iOS
    sources:
      - path: Unikoro
    info:
      path: Unikoro/Info.plist
      properties:
        CFBundleDisplayName: うにコロ
        CFBundleName: Unikoro
        CFBundleDevelopmentRegion: ja
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gonation.unikoro
        TARGETED_DEVICE_FAMILY: "1"   # iPhone のみ
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
  UnikoroTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UnikoroTests
    dependencies:
      - target: Unikoro
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gonation.unikoro.tests
